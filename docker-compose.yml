services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit_dev_password
      POSTGRES_DB: toktickit_dev
    ports:
      - "5432:5432"
    volumes:
      - toktickit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  toktickit_pgdata:
